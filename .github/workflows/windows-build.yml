name: Build Windows installer
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Presence icon
        shell: pwsh
        run: |
          $b64 = Get-Content "assets/presence.ico.b64" -Raw
          [IO.File]::WriteAllBytes("assets/presence.ico", [Convert]::FromBase64String($b64.Trim()))
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --windowed --name PresenceCoach --icon assets/presence.ico --add-data "assets/presence.ico;assets" --collect-all sounddevice --collect-all google.genai --collect-all groq --collect-all docx --collect-all lameenc --hidden-import keyring.backends.Windows session_export_mode.py
      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Presence-Coach-Windows
          path: installer-output/*.exe
