name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version, for example 0.2.0"
        required: true
        default: "0.2.0"
      publish_release:
        description: "Publish the installer to GitHub Releases"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use x.y.z format, for example 0.2.0"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building Presence Coach $version"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          choco install innosetup --no-progress -y

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build bundled Windows application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name PresenceCoach `
            --icon Presence-Coach.ico `
            --add-data "Presence-Coach.ico;." `
            --collect-all sounddevice `
            --collect-all google.genai `
            --collect-all groq `
            --collect-all docx `
            --collect-all lameenc `
            --hidden-import keyring.backends.Windows `
            session_export_mode.py

          if (-not (Test-Path "dist\PresenceCoach\PresenceCoach.exe")) {
            throw "PyInstaller did not create PresenceCoach.exe"
          }

      - name: Compile standalone installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = "installer-output\Presence-Coach-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not created: $installer"
          }
          Write-Host "Created $installer"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presence-Coach-Windows-${{ env.APP_VERSION }}
          path: installer-output/Presence-Coach-Setup-${{ env.APP_VERSION }}.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$env:APP_VERSION"
          }

          $asset = "installer-output\Presence-Coach-Setup-$env:APP_VERSION.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset `
              --target $env:GITHUB_SHA `
              --title "Presence Coach $tag" `
              --generate-notes
          }
